name: Deploy to GitHub Pages

on:
  push:
    branches: ["restauracion-efemerides-3"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Build site
        run: |
          # Si usas Jekyll:
          bundle install
          bundle exec jekyll build --destination ./_site
          # Si solo son archivos Markdown estáticos, elimina estas líneas y asegúrate
          # de que tu contenido esté en la carpeta ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
